import groovy.json.JsonOutput
import java.security.MessageDigest

// Read-only dependency/repository/publication snapshot; does not publish anything.
gradle.projectsEvaluated {
    def root = gradle.rootProject
        root.tasks.register('refactorBuildSnapshot') {
            doLast {
                def snapshot = [:]
                root.subprojects.findAll { it.name != 'fabricWrapper' }.sort { it.name }.each { p ->
                    def configurations = [:]
                    ['compileClasspath', 'runtimeClasspath'].each { name ->
                        def configuration = p.configurations.getByName(name)
                        configurations[name] = [
                            declared: configuration.allDependencies.collect { "${it.group}:${it.name}:${it.version}" }.sort(),
                            forced: configuration.resolutionStrategy.forcedModules.collect { it.toString() }.sort(),
                            resolved: configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                                def digest = MessageDigest.getInstance('SHA-256')
                                artifact.file.withInputStream { input ->
                                    byte[] buffer = new byte[65536]
                                    int length
                                    while ((length = input.read(buffer)) > 0) digest.update(buffer, 0, length)
                                }
                                [id: artifact.moduleVersion.id.toString(), classifier: artifact.classifier,
                                 sha256: digest.digest().encodeHex().toString()]
                            }.sort { "${it.id}:${it.classifier}" }
                        ]
                    }
                    def publication = p.extensions.getByName('publishing').publications.getByName('mavenJava')
                    snapshot[p.name] = [
                        repositories: p.repositories.collect { repository ->
                            [name: repository.name, url: repository.hasProperty('url') ? repository.url.toString() : null]
                        },
                        publication: [group: publication.groupId, artifact: publication.artifactId, version: publication.version],
                        configurations: configurations
                    ]
                }
                def output = new File(root.findProperty('refactorBuildSnapshotPath') ?: "${root.buildDir}/refactor/dependencies.json")
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson(snapshot)) + '\n'
                println("Recorded ${snapshot.size()} target dependency/repository/publication snapshots at ${output}")
            }
        }
}
